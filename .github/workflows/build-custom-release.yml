name: Custom release acceptance and image
on:
  push:
    branches: ['codex/postiz-v2.23.0']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build candidate with acceptance checks
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/scrm77/postiz-app:v2.23.0-custom-${{ github.sha }}
          build-args: NEXT_PUBLIC_VERSION=v2.23.0-custom-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v2.23.0-custom
          cache-from: type=gha,scope=postiz-custom
          cache-to: type=gha,mode=max,scope=postiz-custom
