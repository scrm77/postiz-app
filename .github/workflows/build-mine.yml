name: Build TG-Links
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tg-links (PR #1499 + TS fix)
        uses: actions/checkout@v4
        with:
          ref: tg-links
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and Push (amd64)
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t ghcr.io/${{ github.repository_owner }}/postiz-app:tg-links \
            --build-arg NEXT_PUBLIC_VERSION=tg-links \
            --pull --no-cache \
            --provenance=false --sbom=false \
            --output "type=registry,name=ghcr.io/${{ github.repository_owner }}/postiz-app:tg-links" .
